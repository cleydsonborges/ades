# ADES local development stack
# Usage: docker compose up -d

services:
  ades-api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn src.core.orchestration.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ADES_ENV: local
      ADES_LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
