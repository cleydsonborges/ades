[project]
name = "ades"
version = "0.1.0"
description = "Autonomous Data Engineering System — powered by Agentic AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
agentic = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
data = [
    "pyspark>=3.5.0",
    "dbt-core>=1.7.0",
]
airflow = [
    "apache-airflow>=2.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
]
all = [
    "ades[agentic,data,airflow,dev]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
